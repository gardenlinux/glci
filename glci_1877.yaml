- flavor: container-amd64
  publishing_group: container
- flavor: container-arm64
  publishing_group: container
publishing:
  credentials:
    source: Vault
    server: https://vault.tools.sap
    namespace: gardnlinux
    token:
    token_file:
    role_id:
    secret_id:
  manifest_source: S3
  sources:
  - id: S3
    source: AWS
    config: gardenlinux
    region: eu-central-1
    bucket: gardenlinux-github-releases
  - id: S3-China
    source: AWS
    config: gardenlinux-cn
    region: cn-northwest-1
    bucket: gardenlinux-github-releases
  targets:
  - target: Aliyun
    source: S3
    config: gardenlinux
    region: eu-central-1
    bucket: gardenlinux-community
  - target: AWS
    source: S3
    source_china: S3-China
    config: gardenlinux
    config_china: gardenlinux-cn
    region: eu-central-1
    region_china: cn-northwest-1
    image_tags:
      static_tags:
        sec-by-def-public-image-exception: enabled
  - target: Azure
    source: S3
    source_china: S3-China
    config: gardenlinux
    config_china: gardenlinux-cn
    storage_container: gardenlinux
    resource_group: community-gallery
    gallery: gardenlinux_community_gallery
    region: westeurope
    region_china: chinanorth3
    image_prefix: gardenlinux-nvme
    image_description: Garden Linux - a Linux for containers, based on Debian
    image_eula: https://github.com/gardenlinux/gardenlinux/blob/main/LICENSE.md
    image_release_note: https://github.com/gardenlinux/gardenlinux/releases
    image_publisher: GardenLinux
    image_offer: gardenlinux
    image_sku_prefix: gardenlinux_nvme
  - target: GCP
    source: S3
    config: gardenlinux
    project: sap-se-gcp-gardenlinux
    bucket: gardenlinux-images
  - target: OCI
    source: S3
    config: gardenlinux-hccs
    repository: gardenlinux.common.repositories.cloud.sap/gardenlinux
    allows_delete: false
  - target: OpenStack
    source: S3
    source_china: S3-China
    configs:
    - config: gardenlinux
      endpoint: https://identity-3.{region}.cloud.sap/v3
      domain: monsoon3
      project: gardenlinux
      regions:
      - ap-ae-1
      - ap-au-1
      - ap-cn-1
      - ap-jp-1
      - ap-jp-2
      - ap-sa-1
      - eu-de-1
      - eu-de-2
      - eu-nl-1
      - la-br-1
      - na-ca-1
      - na-us-1
      - na-us-2
      - na-us-3
    - config: gardenlinux-qa
      endpoint: https://identity-3.{region}.cloud.sap/v3
      domain: monsoon3
      project: gardenlinux-live
      regions:
      - qa-de-1
  ocm:
    target: OCI
    config: gardener
    repository: europe-docker.pkg.dev/gardener-project/releases
  state:
    backend: AWS
    config: gardenlinux
    region: eu-central-1
    bucket: glci-state
aliases:
  auditd: [ audit ]
  libc-bin: [ glibc ]
  python3-blinker: [ blinker ]
  python3-jinja2: [ Jinja2 ]
  python3-jwt: [ PyJWT ]
  python3-markupsafe: [ MarkupSafe ]
